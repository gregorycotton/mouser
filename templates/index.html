<!DOCTYPE html>
<html lang="en">

<head>
    <title>Mouser</title>
    <meta charset='UTF-8'>
    <style>
        :root {
            --bg-main: #f2f2f2;
            --bg-modal: #f2f2f2;
            --color-text-main: #000000;
            --color-text-popup: #000000;
            --color-subheading: var(--color-text-main);
            --color-meta: #555;
            --color-accent: #0000FF;
            --color-border: #ccc;
            --color-hover: #f0f8ff;
            --color-modal-hover: var(--color-hover);
        }

        /* Flexoki theme(s) from stephango.com/flexoki */
        body.theme-flexoki {
            --bg-main: #FFFCF0;
            --bg-modal: #F2F0E5;
            --color-text-main: #1C1B1A;
            --color-text-popup: #1C1B1A;
            --color-subheading: #403E3C;
            --color-meta: #6F6E69;
            --color-accent: #24837B;
            --color-border: #E6E4D9;
            --color-hover: #F2F0E5;
            --color-modal-hover: #E6E4D9;
        }

        /* Flexoki theme(s) from stephango.com/flexoki */
        body.theme-flexoki-dark {
            --bg-main: #100F0F;
            --bg-modal: #1C1B1A;
            --color-text-main: #CECDC3;
            --color-text-popup: #CECDC3;
            --color-subheading: #CECDC3;
            --color-meta: #878580;
            --color-accent: #3AA99F;
            --color-border: #282726;
            --color-hover: #1C1B1A;
            --color-modal-hover: #282726;
        }

        html {
            overflow-y: scroll;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background-color: var(--bg-main);
            color: var(--color-text-main);
            margin: 0;
            padding: 0;
        }

        .app-logo {
            display: block;
            width: auto;
            height: 100px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-controls {
            text-align: left;
            margin-top: 5px;
            margin-bottom: 20px;
        }
        
        .header-main-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .theme-switcher {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .theme-btn,
        .action-btn {
            font-size: 12px;
            margin: 0;
        }

        .theme-btn.active {
            background-color: var(--color-accent);
            color: var(--bg-main);
        }

        #search-bar,
        #feed-settings-search {
            width: 100%;
            font-size: 12px;
            height: 31px;
            padding: 5px 10px;
            border: 1px solid var(--color-border);
            box-sizing: border-box;
            background-color: var(--bg-main);
            color: var(--color-text-main);
        }

        #feed-settings-search {
            margin-top: 10px;
        }

        .feed-search-row {
            display: flex;
            align-items: stretch;
            gap: 10px;
        }

        .feed-search-row #search-bar {
            flex: 1;
            min-width: 0;
        }

        .feed-tag-filter-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .feed-tag-filter-menu[hidden] {
            display: none;
        }

        .feed-filter-tag {
            border: 1px solid var(--color-border);
            background: none;
            color: var(--color-text-main);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .feed-filter-tag:hover {
            background-color: var(--color-hover);
        }

        .feed-filter-tag.selected {
            background-color: var(--color-modal-hover);
            border-color: var(--color-meta);
        }

        article {
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: var(--color-text-main);
        }

        h2 {
            color: var(--color-text-main);
        }

        h2 a {
            text-decoration: none;
            color: var(--color-text-main);
        }

        .meta {
            color: var(--color-meta);
        }

        .action-btn {
            background: none;
            border: 1px solid var(--color-accent);
            color: var(--color-accent);
            padding: 5px 10px;
            border-radius: 0;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
        }

        .article-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .load-more-row {
            text-align: center;
            margin: 24px 0 8px;
        }

        .action-btn:hover:not(.active) {
            background-color: var(--color-hover);
        }

        .modal-content .action-btn:hover:not(.active) {
            background-color: var(--color-modal-hover);
        }

        .loading-message {
            text-align: center;
            padding: 40px;
            color: var(--color-meta);
            font-size: 18px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            margin-bottom: 10px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            display: none;
            position: fixed;
            z-index: 101;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background-color: var(--bg-modal);
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            padding: 20px;
            box-sizing: border-box;
            flex-direction: column;
        }

        .modal-content iframe {
            flex-grow: 1;
            border: 1px solid var(--color-accent);
        }

        .modal-footer {
            padding-top: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: baseline;
            gap: 15px;
        }

        .modal-footer .font-size-control {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .modal-footer .font-size-control label {
            color: var(--color-text-main);
            font-size: 14px;
        }

        .modal-footer input[type=number] {
            width: 40px;
            text-align: center;
            background: none;
            color: var(--color-accent);
            border: none;
            border-bottom: 1px solid var(--color-border);
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            -moz-appearance: textfield;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .settings-modal {
            max-width: 900px;
            width: min(900px, 92vw);
            height: min(760px, 88vh);
            gap: 16px;
        }

        .settings-header,
        .settings-footer,
        .settings-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .settings-section-actions,
        .settings-footer-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .settings-header h2,
        .settings-section h3 {
            margin: 0;
            color: var(--color-subheading);
        }

        .settings-body {
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 0;
            overflow-y: auto;
        }

        .settings-section {
            border-top: 1px solid var(--color-border);
            padding-top: 14px;
        }

        .settings-section:first-child {
            border-top: 0;
            padding-top: 0;
        }

        .settings-theme-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .tag-add-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .tag-add-row input,
        .feed-tags-input {
            min-width: 0;
            border: 1px solid var(--color-border);
            background-color: var(--bg-main);
            color: var(--color-text-main);
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            padding: 6px 8px;
            height: 31px;
        }

        .tag-add-row input {
            flex: 1;
        }

        .settings-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag-chip {
            border: 1px solid var(--color-border);
            color: var(--color-text-main);
            padding: 4px 8px;
            font-size: 12px;
        }

        .feed-settings-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
            margin-top: 10px;
        }

        .feed-settings-row {
            display: grid;
            grid-template-columns: minmax(120px, 0.8fr) minmax(220px, 1.7fr) 110px auto;
            gap: 8px;
            align-items: center;
        }

        .feed-settings-item[hidden],
        .feed-options-row[hidden] {
            display: none;
        }

        .feed-options-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            min-height: 31px;
            margin-top: 8px;
            padding-bottom: 31px;
        }

        .feed-tag-picker {
            position: relative;
            min-width: 0;
        }

        .feed-tags-input {
            width: 100%;
        }

        .tag-suggestions {
            position: absolute;
            z-index: 102;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--color-border);
            background-color: var(--bg-modal);
        }

        .tag-suggestion {
            display: block;
            width: 100%;
            border: 0;
            border-bottom: 1px solid var(--color-border);
            background: none;
            color: var(--color-text-main);
            padding: 6px 8px;
            text-align: left;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }

        .tag-suggestion:last-child {
            border-bottom: 0;
        }

        .tag-suggestion:hover {
            background-color: var(--color-modal-hover);
        }

        .feed-settings-row input,
        .feed-settings-row select {
            min-width: 0;
            border: 1px solid var(--color-border);
            background-color: var(--bg-main);
            color: var(--color-text-main);
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            padding: 6px 8px;
            height: 31px;
        }

        .feed-settings-row select {
            color: var(--color-accent);
        }

        .settings-message {
            min-height: 1.4em;
            margin: 8px 0 0;
            color: var(--color-meta);
            font-size: 13px;
        }

        @media (max-width: 720px) {
            .settings-modal {
                width: 94vw;
                height: 90vh;
            }

            .feed-settings-row {
                grid-template-columns: 1fr;
                border-bottom: 1px solid var(--color-border);
                padding-bottom: 10px;
            }

            .feed-options-row {
                grid-template-columns: 1fr;
            }

            .feed-options-row .action-btn {
                width: fit-content;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="app-logo" src="tauri://localhost/assets/mouser-logo.png" alt="Mouser cat logo">
        <p><b>Mouser</b><br>––</p>
        <div class="header-controls">
            <div class="header-main-buttons">
                <button id="reload-btn" class="action-btn">Reload</button>
                <button id="archive-toggle-btn" class="action-btn">Visit archive</button>
                <button id="settings-btn" class="action-btn">Settings</button>
            </div>
        </div>
        <div class="feed-search-row">
            <input type="text" id="search-bar" placeholder="Search feed">
            <button id="feed-tag-filter-btn" class="action-btn" type="button" aria-expanded="false">Filter</button>
        </div>
        <div id="feed-tag-filter-menu" class="feed-tag-filter-menu" hidden></div>
        <div id="articles-container"></div>
    </div>

    <div id="modal-overlay" class="modal-overlay"></div>
    <div id="article-modal" class="modal-content">
        <iframe id="modal-iframe"></iframe>
        <div class="modal-footer">
            <div class="font-size-control">
                <label for="font-size-input">Font Size:</label>
                <input type="number" id="font-size-input" value="16" min="8" max="48">
            </div>
            <button id="copyBtn" class="action-btn">Copy title/URL</button>
            <button id="close-modal-btn" class="action-btn">Show less</button>
        </div>
    </div>

    <div id="settings-modal" class="modal-content settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-header">
            <h2 id="settings-title">Settings</h2>
            <button id="close-settings-btn" class="action-btn">Close</button>
        </div>
        <div class="settings-body">
            <section class="settings-section">
                <h3>Theme</h3>
                <div class="settings-theme-row">
                    <button class="action-btn theme-btn" data-theme="light" title="Light">Light</button>
                    <button class="action-btn theme-btn" data-theme="flexoki" title="Flexoki (light)">Flexoki (light)</button>
                    <button class="action-btn theme-btn" data-theme="flexoki-dark" title="Flexoki (dark)">Flexoki (dark)</button>
                </div>
            </section>
            <section class="settings-section">
                <h3>Tags</h3>
                <div class="tag-add-row">
                    <input id="new-feed-tag-input" type="text" maxlength="40" placeholder="Tag name">
                    <button id="add-feed-tag-btn" class="action-btn">Add tag</button>
                </div>
                <div id="settings-tag-list" class="settings-tag-list"></div>
                <p id="tag-settings-message" class="settings-message"></p>
            </section>
            <section class="settings-section">
                <div class="settings-section-header">
                    <h3>Feeds</h3>
                    <div class="settings-section-actions">
                        <button id="load-feeds-btn" class="action-btn">Load JSON</button>
                        <button id="add-feed-btn" class="action-btn">Add feed</button>
                    </div>
                    <input id="load-feeds-input" type="file" accept="application/json,.json" hidden>
                </div>
                <input type="text" id="feed-settings-search" placeholder="Search feeds">
                <div id="feed-settings-list" class="feed-settings-list"></div>
                <p id="feed-search-empty" class="settings-message" hidden>No matching feeds.</p>
                <p id="feed-settings-message" class="settings-message"></p>
            </section>
        </div>
        <div class="settings-footer">
            <div class="settings-footer-actions">
                <button id="save-feeds-btn" class="action-btn">Save feeds</button>
                <button id="export-feeds-btn" class="action-btn">Export feeds</button>
            </div>
            <button id="done-settings-btn" class="action-btn">Done</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const invoke = window.__TAURI__.core.invoke;
            let allEntries = [];
            let isShowingArchive = false;
            const ARTICLE_BATCH_SIZE = 20;
            const REFRESH_INTERVAL_MS = 15 * 60 * 1000;
            let nextCursor = null;
            let isLoadingMore = false;
            let syncPromise = null;
            let pageRequestId = 0;
            let searchTimer = null;
            const articlesContainer = document.getElementById('articles-container');
            const modalIframe = document.getElementById('modal-iframe');
            const archiveToggleButton = document.getElementById('archive-toggle-btn');
            const searchBar = document.getElementById('search-bar');
            const feedTagFilterButton = document.getElementById('feed-tag-filter-btn');
            const feedTagFilterMenu = document.getElementById('feed-tag-filter-menu');
            const modalOverlay = document.getElementById('modal-overlay');
            const articleModal = document.getElementById('article-modal');
            const settingsModal = document.getElementById('settings-modal');
            const feedSettingsList = document.getElementById('feed-settings-list');
            const feedSettingsSearch = document.getElementById('feed-settings-search');
            const feedSearchEmpty = document.getElementById('feed-search-empty');
            const feedSettingsMessage = document.getElementById('feed-settings-message');
            const newFeedTagInput = document.getElementById('new-feed-tag-input');
            const settingsTagList = document.getElementById('settings-tag-list');
            const tagSettingsMessage = document.getElementById('tag-settings-message');
            const loadFeedsInput = document.getElementById('load-feeds-input');
            let feedSources = [];
            let feedTags = [];
            const selectedFeedTags = new Set();

            modalOverlay.style.display = 'none';
            articleModal.style.display = 'none';
            settingsModal.style.display = 'none';

            const getLegacyArchivedLinks = () => {
                try {
                    return JSON.parse(localStorage.getItem('greg_archived_posts') || '[]');
                } catch {
                    return [];
                }
            };

            const archivePayload = (entry) => ({
                id: entry.id,
                link: entry.link,
                title: entry.title,
                author: entry.author,
                pubDate: entry.pubDate,
                source_type: entry.source_type
            });

            const archiveEntry = async (entry) => {
                await invoke('archive_article', { entry: archivePayload(entry) });
            };

            const reinstateEntry = async (articleId) => {
                await invoke('reinstate_article', { articleId });
            };

            const deleteEntry = async (articleId) => {
                await invoke('delete_article', { articleId });
            };

            const migrateLegacyArchive = async () => {
                const legacyLinks = new Set(getLegacyArchivedLinks());
                if (legacyLinks.size === 0) return false;

                for (const link of legacyLinks) {
                    const entry = allEntries.find(entry => entry.link === link) || { link };
                    await archiveEntry(entry);
                }
                localStorage.removeItem('greg_archived_posts');
                return true;
            };

            const updateIframeTheme = () => {
                if (!modalIframe.contentWindow || !modalIframe.contentWindow.document.head) return;
                const computedStyle = getComputedStyle(document.body);
                const iframeDoc = modalIframe.contentWindow.document;
                let style = iframeDoc.getElementById('dynamic-theme-style');
                if (!style) {
                    style = iframeDoc.createElement('style');
                    style.id = 'dynamic-theme-style';
                    iframeDoc.head.appendChild(style);
                }
                style.innerHTML = `
                    body {
                        font-family: Arial, Helvetica, sans-serif;
                        line-height: 1.6; margin: 10px; padding: 0;
                        background-color: ${computedStyle.getPropertyValue('--bg-modal')};
                        color: ${computedStyle.getPropertyValue('--color-text-popup')};
                    }
                    h2 { margin-top: 0; font-size: 1.5em; color: ${computedStyle.getPropertyValue('--color-text-popup')}; }
                    h2 a { color: ${computedStyle.getPropertyValue('--color-accent')}; text-decoration: none; }
                    p.meta { color: ${computedStyle.getPropertyValue('--color-meta')}; margin-top: -1em; margin-bottom: 1em; font-size: 0.9em; }
                    hr { border: 0; border-top: 1px solid ${computedStyle.getPropertyValue('--color-border')}; margin: 1em 0; }
                    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; background: #000; margin-bottom: 20px; }
                    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
                    img { max-width: 100% !important; height: auto !important; }
                    a { color: ${computedStyle.getPropertyValue('--color-accent')}; }
                `;
            };

            const applyTheme = (theme) => {
                document.body.className = `theme-${theme}`;
                localStorage.setItem('preferredTheme', theme);
                document.querySelectorAll('.theme-btn').forEach(button => {
                    button.classList.toggle('active', button.dataset.theme === theme);
                });
                updateIframeTheme();
            };

            const setFeedSettingsMessage = (message, isError = false) => {
                feedSettingsMessage.textContent = message;
                feedSettingsMessage.style.color = isError ? 'var(--color-accent)' : 'var(--color-meta)';
            };

            const setTagSettingsMessage = (message, isError = false) => {
                tagSettingsMessage.textContent = message;
                tagSettingsMessage.style.color = isError ? 'var(--color-accent)' : 'var(--color-meta)';
            };

            const cleanTagName = (value) => {
                const tag = String(value || '').trim();
                if (!tag) throw new Error('Enter a tag name.');
                if (tag.toLowerCase() === 'misc.') throw new Error('Misc. is reserved for feeds without tags.');
                if (tag.includes(',')) throw new Error('Tag names cannot contain commas.');
                if (tag.length > 40) throw new Error('Tag names must be 40 characters or fewer.');
                return tag;
            };

            const canonicalFeedTag = (value) => feedTags.find(tag => tag.toLowerCase() === value.trim().toLowerCase());

            const renderTagSettings = () => {
                settingsTagList.innerHTML = '';
                if (feedTags.length === 0) {
                    const emptyMessage = document.createElement('span');
                    emptyMessage.className = 'settings-message';
                    emptyMessage.textContent = 'No custom tags yet.';
                    settingsTagList.appendChild(emptyMessage);
                    return;
                }

                feedTags.forEach(tag => {
                    const chip = document.createElement('span');
                    chip.className = 'tag-chip';
                    chip.textContent = tag;
                    settingsTagList.appendChild(chip);
                });
            };

            const renderFeedTagFilter = () => {
                const availableTags = [...feedTags, 'Misc.'];
                for (const selectedTag of selectedFeedTags) {
                    if (!availableTags.includes(selectedTag)) selectedFeedTags.delete(selectedTag);
                }

                feedTagFilterMenu.innerHTML = '';
                availableTags.forEach(tag => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'feed-filter-tag';
                    button.classList.toggle('selected', selectedFeedTags.has(tag));
                    button.setAttribute('aria-pressed', String(selectedFeedTags.has(tag)));
                    button.textContent = tag;
                    button.dataset.tag = tag;
                    feedTagFilterMenu.appendChild(button);
                });
            };

            const addFeedTag = () => {
                try {
                    const tag = cleanTagName(newFeedTagInput.value);
                    if (canonicalFeedTag(tag)) throw new Error(`${tag} already exists.`);
                    if (feedTags.length >= 100) throw new Error('A maximum of 100 custom tags is supported.');
                    feedTags.push(tag);
                    newFeedTagInput.value = '';
                    renderTagSettings();
                    setTagSettingsMessage('Tag added. Press Save feeds to apply.');
                } catch (error) {
                    setTagSettingsMessage(String(error), true);
                }
            };

            const parseFeedTagInput = (value) => {
                const selectedTags = [];
                for (const rawTag of value.split(',').map(tag => tag.trim()).filter(Boolean)) {
                    const tag = canonicalFeedTag(rawTag);
                    if (!tag) throw new Error(`Unknown tag: ${rawTag}`);
                    if (!selectedTags.includes(tag)) selectedTags.push(tag);
                }
                return selectedTags;
            };

            const renderTagSuggestions = (input) => {
                const suggestions = input.closest('.feed-tag-picker').querySelector('.tag-suggestions');
                const parts = input.value.split(',');
                const query = parts.pop().trim().toLowerCase();
                const selectedTags = parts
                    .map(tag => canonicalFeedTag(tag))
                    .filter(Boolean);
                const matches = query
                    ? feedTags.filter(tag =>
                        !selectedTags.includes(tag) && tag.toLowerCase().includes(query)
                    )
                    : [];

                suggestions.innerHTML = '';
                matches.forEach(tag => {
                    const option = document.createElement('button');
                    option.type = 'button';
                    option.className = 'tag-suggestion';
                    option.textContent = tag;
                    option.addEventListener('mousedown', event => event.preventDefault());
                    option.addEventListener('click', () => {
                        const values = input.value.split(',').slice(0, -1).map(value => value.trim()).filter(Boolean);
                        if (!values.some(value => value.toLowerCase() === tag.toLowerCase())) values.push(tag);
                        input.value = `${values.join(', ')}, `;
                        input.focus();
                        renderTagSuggestions(input);
                    });
                    suggestions.appendChild(option);
                });
                suggestions.hidden = document.activeElement !== input || matches.length === 0;
            };

            const filterFeedSettings = () => {
                const query = feedSettingsSearch.value.trim().toLowerCase();
                const items = feedSettingsList.querySelectorAll('.feed-settings-item');
                let matchingItems = 0;

                items.forEach(item => {
                    const searchableText = Array.from(item.querySelectorAll('input, select'))
                        .map(field => field.value)
                        .join(' ')
                        .toLowerCase();
                    item.hidden = Boolean(query) && !searchableText.includes(query);
                    if (!item.hidden) matchingItems += 1;
                });

                feedSearchEmpty.hidden = !query || matchingItems > 0 || items.length === 0;
            };

            const renderFeedSettings = () => {
                feedSettingsList.innerHTML = '';

                if (feedSources.length === 0) {
                    const emptyMessage = document.createElement('p');
                    emptyMessage.className = 'settings-message';
                    emptyMessage.textContent = 'No feeds yet.';
                    feedSettingsList.appendChild(emptyMessage);
                    filterFeedSettings();
                    return;
                }

                feedSources.forEach((source, index) => {
                    const item = document.createElement('div');
                    item.className = 'feed-settings-item';
                    item.dataset.index = String(index);

                    const row = document.createElement('div');
                    row.className = 'feed-settings-row';
                    row.dataset.index = String(index);

                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.placeholder = 'Name';
                    nameInput.value = source.name || '';
                    nameInput.dataset.field = 'name';

                    const rssInput = document.createElement('input');
                    rssInput.type = 'url';
                    rssInput.placeholder = 'RSS / Atom / YouTube URL';
                    rssInput.value = source.rss || '';
                    rssInput.dataset.field = 'rss';

                    const typeSelect = document.createElement('select');
                    typeSelect.dataset.field = 'type';
                    const blogOption = new Option('Blog', 'blog');
                    const youtubeOption = new Option('YouTube', 'youtube');
                    typeSelect.append(blogOption, youtubeOption);
                    typeSelect.value = source.type || source.source_type || 'blog';

                    const optionsButton = document.createElement('button');
                    optionsButton.type = 'button';
                    optionsButton.className = 'action-btn feed-options-btn';
                    optionsButton.textContent = 'Options';

                    const optionsRow = document.createElement('div');
                    optionsRow.className = 'feed-options-row';
                    optionsRow.hidden = true;

                    const tagPicker = document.createElement('div');
                    tagPicker.className = 'feed-tag-picker';
                    const tagsInput = document.createElement('input');
                    tagsInput.type = 'text';
                    tagsInput.className = 'feed-tags-input';
                    tagsInput.placeholder = 'Add tags';
                    tagsInput.value = (source.tags || []).join(', ');
                    const tagSuggestions = document.createElement('div');
                    tagSuggestions.className = 'tag-suggestions';
                    tagSuggestions.hidden = true;
                    tagPicker.append(tagsInput, tagSuggestions);

                    tagsInput.addEventListener('input', () => renderTagSuggestions(tagsInput));
                    tagsInput.addEventListener('blur', () => { tagSuggestions.hidden = true; });
                    tagsInput.addEventListener('keydown', event => {
                        if (event.key !== 'Enter') return;
                        const firstSuggestion = tagSuggestions.querySelector('.tag-suggestion');
                        if (!firstSuggestion) return;
                        event.preventDefault();
                        firstSuggestion.click();
                    });

                    const saveTagsButton = document.createElement('button');
                    saveTagsButton.type = 'button';
                    saveTagsButton.className = 'action-btn save-feed-tags-btn';
                    saveTagsButton.textContent = 'Save tags';

                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.className = 'action-btn delete-feed-btn';
                    deleteButton.textContent = 'Delete feed';

                    row.append(nameInput, rssInput, typeSelect, optionsButton);
                    optionsRow.append(tagPicker, saveTagsButton, deleteButton);
                    item.append(row, optionsRow);
                    feedSettingsList.appendChild(item);
                });

                filterFeedSettings();
            };

            const collectFeedSettings = ({ allowIncomplete = false } = {}) => {
                const sources = [];
                const rows = feedSettingsList.querySelectorAll('.feed-settings-row');

                rows.forEach((row, index) => {
                    const name = row.querySelector('[data-field="name"]').value.trim();
                    const rss = row.querySelector('[data-field="rss"]').value.trim();
                    const type = row.querySelector('[data-field="type"]').value;
                    const sourceIndex = Number(row.dataset.index);
                    const tags = feedSources[sourceIndex]?.tags || [];

                    if (!allowIncomplete && !name && !rss) return;
                    if (!allowIncomplete && (!name || !rss)) {
                        throw new Error(`Feed ${index + 1} needs both a name and a URL.`);
                    }

                    sources.push({ name, rss, type, tags });
                });

                return sources;
            };

            const parseFeedConfigJson = (json) => {
                let parsed;
                try {
                    parsed = JSON.parse(json);
                } catch {
                    throw new Error('The selected file is not valid JSON.');
                }

                const isLegacyExport = Array.isArray(parsed);
                const sources = isLegacyExport ? parsed : parsed?.feeds;
                if (!Array.isArray(sources)) {
                    throw new Error('Feed JSON must contain a feeds array.');
                }

                const rawTags = isLegacyExport
                    ? sources.flatMap(source => Array.isArray(source?.tags) ? source.tags : [])
                    : (parsed.tags || []);
                if (!Array.isArray(rawTags)) throw new Error('Feed JSON tags must be an array.');

                const importedTags = [];
                rawTags.forEach(rawTag => {
                    if (typeof rawTag !== 'string') throw new Error('Tag names must be text.');
                    const tag = cleanTagName(rawTag);
                    if (!importedTags.some(existing => existing.toLowerCase() === tag.toLowerCase())) {
                        importedTags.push(tag);
                    }
                });

                const importedSources = sources.map((source, index) => {
                    const feedNumber = index + 1;
                    if (!source || typeof source !== 'object' || Array.isArray(source)) {
                        throw new Error(`Feed ${feedNumber} must be an object.`);
                    }
                    if (typeof source.name !== 'string' || !source.name.trim()) {
                        throw new Error(`Feed ${feedNumber} needs a name.`);
                    }
                    if (typeof source.rss !== 'string' || !source.rss.trim()) {
                        throw new Error(`Feed ${feedNumber} needs an RSS URL.`);
                    }

                    const type = source.type || 'blog';
                    if (!['blog', 'youtube'].includes(type)) {
                        throw new Error(`Feed ${feedNumber} has an unsupported type.`);
                    }

                    let url;
                    try {
                        url = new URL(source.rss.trim());
                    } catch {
                        throw new Error(`Feed ${feedNumber} has an invalid RSS URL.`);
                    }
                    if (!['http:', 'https:'].includes(url.protocol)) {
                        throw new Error(`Feed ${feedNumber} must use an HTTP or HTTPS URL.`);
                    }

                    if (source.tags !== undefined && !Array.isArray(source.tags)) {
                        throw new Error(`Feed ${feedNumber} tags must be an array.`);
                    }
                    const tags = (source.tags || []).map(rawTag => {
                        if (typeof rawTag !== 'string') throw new Error(`Feed ${feedNumber} has an invalid tag.`);
                        const tag = importedTags.find(existing => existing.toLowerCase() === rawTag.trim().toLowerCase());
                        if (!tag) throw new Error(`Feed ${feedNumber} uses an unknown tag: ${rawTag}`);
                        return tag;
                    }).filter((tag, tagIndex, allTags) => allTags.indexOf(tag) === tagIndex);

                    return {
                        name: source.name.trim(),
                        rss: source.rss.trim(),
                        type,
                        tags
                    };
                });

                return { tags: importedTags, feeds: importedSources };
            };

            const loadFeedSettingsJson = async () => {
                const file = loadFeedsInput.files[0];
                loadFeedsInput.value = '';
                if (!file) return;

                try {
                    if (file.size > 5 * 1024 * 1024) {
                        throw new Error('Feed JSON must be smaller than 5 MB.');
                    }
                    const importedConfig = parseFeedConfigJson(await file.text());
                    feedTags = importedConfig.tags;
                    feedSources = importedConfig.feeds;
                    feedSettingsSearch.value = '';
                    renderTagSettings();
                    renderFeedSettings();
                    const noun = feedSources.length === 1 ? 'feed' : 'feeds';
                    setFeedSettingsMessage(`Loaded ${feedSources.length} ${noun}. Press Save feeds to apply.`);
                } catch (error) {
                    console.error('Error loading feed JSON:', error);
                    setFeedSettingsMessage(String(error), true);
                }
            };

            const exportFeedSettings = async () => {
                const exportButton = document.getElementById('export-feeds-btn');
                exportButton.disabled = true;
                setFeedSettingsMessage('Exporting saved feeds.');
                try {
                    const exportPath = await invoke('export_feed_sources');
                    setFeedSettingsMessage(`Exported saved feeds to ${exportPath}.`);
                } catch (error) {
                    console.error('Error exporting feeds:', error);
                    setFeedSettingsMessage(String(error), true);
                } finally {
                    exportButton.disabled = false;
                }
            };

            const openSettings = async () => {
                modalOverlay.style.display = 'block';
                settingsModal.style.display = 'flex';
                setFeedSettingsMessage('Loading feeds.');
                feedSettingsSearch.value = '';
                feedSettingsList.innerHTML = '';

                try {
                    const config = await invoke('get_feed_configuration');
                    feedSources = config.feeds || [];
                    feedTags = config.tags || [];
                    renderTagSettings();
                    renderFeedSettings();
                    setTagSettingsMessage('');
                    setFeedSettingsMessage('');
                } catch (error) {
                    console.error('Error loading feed settings:', error);
                    setFeedSettingsMessage('Failed to load feeds.', true);
                }
            };

            const closeSettingsModal = () => {
                settingsModal.style.display = 'none';
                if (articleModal.style.display !== 'flex') {
                    modalOverlay.style.display = 'none';
                }
            };

            const saveFeedSettings = async () => {
                try {
                    const sources = collectFeedSettings();
                    setFeedSettingsMessage('Saving feeds.');
                    const savedConfig = await invoke('save_feed_sources', { sources, tags: feedTags });
                    feedSources = savedConfig.feeds || [];
                    feedTags = savedConfig.tags || [];
                    renderTagSettings();
                    renderFeedTagFilter();
                    renderFeedSettings();
                    setTagSettingsMessage('');
                    setFeedSettingsMessage('Saved.');
                    if (syncPromise) await syncPromise.catch(() => {});
                    await refreshFeeds();
                } catch (error) {
                    console.error('Error saving feed settings:', error);
                    setFeedSettingsMessage(String(error), true);
                }
            };

            const textFromHtml = (html) => new DOMParser().parseFromString(html || '', 'text/html').body.textContent || '';

            const escapeAttribute = (value) => String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;');

            const prepareEntries = (entries) => {
                return entries.map(entry => {
                    const plainTextDescription = entry.source_type === 'youtube'
                        ? 'YouTube video'
                        : textFromHtml(entry.description);
                    const summaryText = entry.source_type === 'youtube'
                        ? 'YouTube video'
                        : (plainTextDescription.length > 250 ? plainTextDescription.substring(0, 250) + '...' : plainTextDescription);

                    return {
                        ...entry,
                        summaryText,
                        searchText: `${entry.title || ''} ${entry.author || ''} ${plainTextDescription}`.toLowerCase()
                    };
                });
            };

            const getEntryMetaLine = (entry) => {
                const dateStr = entry.pubDate ? ` &middot; ${new Date(entry.pubDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}` : "";
                return `<strong>${entry.author}</strong>${dateStr}`;
            };

            const buildArticleModalContent = (entry) => {
                const metaLine = getEntryMetaLine(entry);
                const iframeHeader = `<h2>${entry.title}</h2><p class="meta">${metaLine}</p>`;
                let iframeBody = iframeHeader + '<hr>' + (entry.description || '');

                if (entry.source_type === 'youtube' && entry.video_id) {
                    const youtubeEmbedHTML = `
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/${entry.video_id}?playsinline=1&origin=https%3A%2F%2Fcom.gregorycotton.gregs-feed&widget_referrer=https%3A%2F%2Fcom.gregorycotton.gregs-feed" referrerpolicy="strict-origin-when-cross-origin" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>`;
                    iframeBody = iframeHeader + youtubeEmbedHTML + '<hr>' + (entry.description || '');
                }

                return `<!DOCTYPE html><html><head></head><body>${iframeBody}</body></html>`;
            };

            const openArticleModal = (entry) => {
                const copyBtn = document.getElementById('copyBtn');
                const fontSizeInput = document.getElementById('font-size-input');
                copyBtn.dataset.link = entry.link;
                copyBtn.dataset.title = entry.title;

                const savedSize = localStorage.getItem('preferredFontSize');
                if (savedSize) fontSizeInput.value = savedSize;

                modalIframe.srcdoc = buildArticleModalContent(entry);
                modalOverlay.style.display = 'block';
                articleModal.style.display = 'flex';
            };

            const createArticleElement = (entry, index) => {
                const articleEl = document.createElement('article');
                articleEl.id = `article-${entry.id || index}`;

                const metaLine = getEntryMetaLine(entry);
                let summaryHTML = "";

                if (entry.source_type === 'youtube' && entry.video_id) {
                    summaryHTML = `
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/${entry.video_id}?playsinline=1&origin=https%3A%2F%2Fcom.gregorycotton.gregs-feed&widget_referrer=https%3A%2F%2Fcom.gregorycotton.gregs-feed" referrerpolicy="strict-origin-when-cross-origin" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>`;
                } else {
                    summaryHTML = `<div class="summary">${entry.summaryText || ''}</div>`;
                }

                const archiveButtons = isShowingArchive
                    ? `<button class="action-btn reinstate-btn" data-id="${entry.id}">Reinstate</button>
                       <button class="action-btn permanent-delete-btn" data-id="${entry.id}">Delete</button>`
                    : `<button class="action-btn archive-btn" data-id="${entry.id}">Archive</button>`;
                const previewButton = `<button class="action-btn preview-btn" data-id="${entry.id}">Preview</button>`;

                articleEl.innerHTML = `
                    <h2><a href="${escapeAttribute(entry.link)}" class="article-web-link" data-id="${entry.id}">${entry.title}</a></h2>
                    <div class="meta">${metaLine}</div>
                    ${summaryHTML}
                    <div class="article-actions">
                        ${previewButton}
                        ${archiveButtons}
                    </div>
                `;
                return articleEl;
            };

            const appendEntries = (entries, startIndex = 0) => {
                const fragment = document.createDocumentFragment();
                entries.forEach((entry, offset) => {
                    fragment.appendChild(createArticleElement(entry, startIndex + offset));
                });
                articlesContainer.appendChild(fragment);
            };

            const renderLoadMoreButton = () => {
                const existingButtonRow = document.getElementById('load-more-row');
                if (existingButtonRow) existingButtonRow.remove();
                if (!nextCursor) return;

                const buttonRow = document.createElement('div');
                buttonRow.id = 'load-more-row';
                buttonRow.className = 'load-more-row';
                buttonRow.innerHTML = `<button id="load-more-btn" class="action-btn">Load more</button>`;
                articlesContainer.appendChild(buttonRow);
            };

            const loadArticlesPage = async ({ reset = false, limit = ARTICLE_BATCH_SIZE } = {}) => {
                if (!reset && (isLoadingMore || !nextCursor)) return;
                const requestId = reset ? ++pageRequestId : pageRequestId;
                if (!reset) isLoadingMore = true;

                try {
                    const page = await invoke('get_articles_page', {
                        archived: isShowingArchive,
                        cursor: reset ? null : nextCursor,
                        query: searchBar.value.trim() || null,
                        tags: selectedFeedTags.size ? Array.from(selectedFeedTags) : null,
                        limit,
                    });
                    if (requestId !== pageRequestId) return;

                    const entries = prepareEntries(page.entries || []);
                    allEntries = reset ? entries : allEntries.concat(entries);
                    nextCursor = page.next_cursor || null;
                    renderCurrentView();
                } finally {
                    if (!reset) isLoadingMore = false;
                }
            };

            const renderCurrentView = () => {
                archiveToggleButton.textContent = isShowingArchive ? "Return to feed" : "Visit archive";
                searchBar.placeholder = isShowingArchive ? "Search archive" : "Search feed";
                articlesContainer.innerHTML = '';

                if (allEntries.length === 0) {
                    const emptyMessage = searchBar.value.trim()
                        ? 'No matching articles.'
                        : (selectedFeedTags.size
                            ? 'No articles in the selected tags.'
                            : (isShowingArchive ? 'Your archive is empty.' : 'All caught up!'));
                    articlesContainer.innerHTML = `<p class="loading-message">${emptyMessage}</p>`;
                    return;
                }

                appendEntries(allEntries);
                renderLoadMoreButton();
            };

            const refreshFeeds = async () => {
                if (syncPromise) return syncPromise;
                const reloadButton = document.getElementById('reload-btn');
                reloadButton.disabled = true;
                reloadButton.textContent = 'Refreshing';
                syncPromise = invoke('refresh_feeds')
                    .then(async result => {
                        const visibleCount = Math.max(ARTICLE_BATCH_SIZE, allEntries.length);
                        await loadArticlesPage({ reset: true, limit: visibleCount });
                        if (result.failed_feeds?.length) {
                            console.warn('Feeds that failed to refresh:', result.failed_feeds);
                        }
                        return result;
                    })
                    .catch(error => {
                        console.error('Error refreshing feeds:', error);
                        throw error;
                    })
                    .finally(() => {
                        syncPromise = null;
                        reloadButton.disabled = false;
                        reloadButton.textContent = 'Reload';
                    });
                return syncPromise;
            };

            const loadFeed = async () => {
                try {
                    await loadArticlesPage({ reset: true });
                    const migratedArchive = await migrateLegacyArchive();
                    if (migratedArchive) await loadArticlesPage({ reset: true });
                    if (allEntries.length === 0 && !isShowingArchive) {
                        articlesContainer.innerHTML = '<p class="loading-message">Building feed.</p>';
                        await refreshFeeds();
                    } else {
                        refreshFeeds().catch(() => {});
                    }
                } catch (error) {
                    articlesContainer.innerHTML = '<p class="loading-message">Failed to load feed.</p>';
                    console.error('Error loading feed:', error);
                }
            };

            const initializeFeed = async () => {
                try {
                    const config = await invoke('get_feed_configuration');
                    feedSources = config.feeds || [];
                    feedTags = config.tags || [];
                    renderFeedTagFilter();
                } catch (error) {
                    console.error('Error loading feed tags:', error);
                }
                await loadFeed();
            };
            
            document.getElementById('reload-btn').addEventListener('click', () => {
                refreshFeeds().catch(() => {});
            });
            document.getElementById('settings-btn').addEventListener('click', openSettings);
            feedTagFilterButton.addEventListener('click', () => {
                feedTagFilterMenu.hidden = !feedTagFilterMenu.hidden;
                feedTagFilterButton.setAttribute('aria-expanded', String(!feedTagFilterMenu.hidden));
            });
            feedTagFilterMenu.addEventListener('click', event => {
                const button = event.target.closest('.feed-filter-tag');
                if (!button) return;
                const tag = button.dataset.tag;
                if (selectedFeedTags.has(tag)) {
                    selectedFeedTags.delete(tag);
                } else {
                    selectedFeedTags.add(tag);
                }
                renderFeedTagFilter();
                loadArticlesPage({ reset: true }).catch(error => {
                    console.error('Error filtering articles by tag:', error);
                });
            });
            document.getElementById('add-feed-tag-btn').addEventListener('click', addFeedTag);
            newFeedTagInput.addEventListener('keydown', event => {
                if (event.key !== 'Enter') return;
                event.preventDefault();
                addFeedTag();
            });
            feedSettingsSearch.addEventListener('input', filterFeedSettings);
            document.getElementById('load-feeds-btn').addEventListener('click', () => loadFeedsInput.click());
            loadFeedsInput.addEventListener('change', loadFeedSettingsJson);
            document.getElementById('add-feed-btn').addEventListener('click', () => {
                feedSources = collectFeedSettings({ allowIncomplete: true });
                feedSources.push({ name: '', rss: '', type: 'blog', tags: [] });
                feedSettingsSearch.value = '';
                renderFeedSettings();
                setFeedSettingsMessage('');
            });
            document.getElementById('save-feeds-btn').addEventListener('click', saveFeedSettings);
            document.getElementById('export-feeds-btn').addEventListener('click', exportFeedSettings);
            document.getElementById('done-settings-btn').addEventListener('click', closeSettingsModal);
            document.getElementById('close-settings-btn').addEventListener('click', closeSettingsModal);
            feedSettingsList.addEventListener('click', (event) => {
                const item = event.target.closest('.feed-settings-item');
                if (!item) return;
                const sourceIndex = Number(item.dataset.index);

                if (event.target.classList.contains('feed-options-btn')) {
                    const optionsRow = item.querySelector('.feed-options-row');
                    optionsRow.hidden = !optionsRow.hidden;
                    if (!optionsRow.hidden) item.querySelector('.feed-tags-input').focus();
                    return;
                }

                if (event.target.classList.contains('save-feed-tags-btn')) {
                    try {
                        const tagsInput = item.querySelector('.feed-tags-input');
                        const selectedTags = parseFeedTagInput(tagsInput.value);
                        feedSources = collectFeedSettings({ allowIncomplete: true });
                        feedSources[sourceIndex].tags = selectedTags;
                        tagsInput.value = selectedTags.join(', ');
                        item.querySelector('.feed-options-row').hidden = true;
                        setFeedSettingsMessage('Tags updated. Press Save feeds to apply.');
                    } catch (error) {
                        setFeedSettingsMessage(String(error), true);
                    }
                    return;
                }

                if (event.target.classList.contains('delete-feed-btn')) {
                    feedSources = collectFeedSettings({ allowIncomplete: true });
                    feedSources.splice(sourceIndex, 1);
                    renderFeedSettings();
                    setFeedSettingsMessage('Feed removed. Press Save feeds to apply.');
                }
            });
            archiveToggleButton.addEventListener('click', async () => {
                isShowingArchive = !isShowingArchive;
                searchBar.value = '';
                await loadArticlesPage({ reset: true });
            });

            articlesContainer.addEventListener('click', async function (e) {
                const target = e.target;
                const articleWebLink = target.closest('.article-web-link');

                if (articleWebLink) {
                    e.preventDefault();
                    const entry = allEntries.find(item => item.id === articleWebLink.dataset.id);
                    if (!entry) return;
                    try {
                        await invoke('open_external_url', { url: entry.link });
                    } catch (error) {
                        console.error('Error opening article in browser:', error);
                    }
                }
                else if (target.id === 'load-more-btn') {
                    target.disabled = true;
                    try {
                        await loadArticlesPage();
                    } catch (error) {
                        console.error('Error loading more articles:', error);
                        target.disabled = false;
                    }
                }
                else if (target.classList.contains('archive-btn') || target.classList.contains('reinstate-btn')) {
                    const articleId = target.dataset.id;
                    const entry = allEntries.find(item => item.id === articleId);
                    target.disabled = true;
                    try {
                        if (target.classList.contains('archive-btn')) {
                            if (!entry) throw new Error('Could not find article to archive.');
                            await archiveEntry(entry);
                        } else {
                            await reinstateEntry(articleId);
                        }
                        allEntries = allEntries.filter(item => item.id !== articleId);
                        renderCurrentView();
                    } catch (error) {
                        console.error('Error updating archive:', error);
                        target.disabled = false;
                    }
                }
                else if (target.classList.contains('permanent-delete-btn')) {
                    const articleId = target.dataset.id;
                    target.disabled = true;
                    try {
                        await deleteEntry(articleId);
                        allEntries = allEntries.filter(item => item.id !== articleId);
                        renderCurrentView();
                    } catch (error) {
                        console.error('Error deleting article:', error);
                        target.disabled = false;
                    }
                }
                else if (target.classList.contains('preview-btn')) {
                    const entry = allEntries.find(item => item.id === target.dataset.id);
                    if (entry) openArticleModal(entry);
                }
            });

            const closeArticleModal = () => {
                articleModal.style.display = 'none';
                if (settingsModal.style.display !== 'flex') {
                    modalOverlay.style.display = 'none';
                }
                modalIframe.srcdoc = '';
            };

            document.getElementById('close-modal-btn').addEventListener('click', closeArticleModal);
            modalOverlay.addEventListener('click', () => {
                if (articleModal.style.display === 'flex') closeArticleModal();
                if (settingsModal.style.display === 'flex') closeSettingsModal();
            });
            document.getElementById('font-size-input').addEventListener('input', function () {
                const newSize = this.value;
                localStorage.setItem('preferredFontSize', newSize);
                if (modalIframe.contentWindow && newSize >= 8) {
                    modalIframe.contentWindow.document.body.style.fontSize = newSize + 'px';
                }
            });
            document.getElementById('copyBtn').addEventListener('click', function () {
                const title = this.dataset.title;
                const link = this.dataset.link;
                if (!title || !link) return;
                const textToCopy = `\n${title}\n${link}`;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = this.textContent;
                    this.textContent = 'Copied!';
                    setTimeout(() => { this.textContent = originalText; }, 1500);
                }).catch(err => console.error('Failed to copy text: ', err));
            });
            modalIframe.addEventListener('load', () => {
                updateIframeTheme();
                const size = document.getElementById('font-size-input').value;
                if (modalIframe.contentWindow && size >= 8) {
                    modalIframe.contentWindow.document.body.style.fontSize = size + 'px';
                }
            });

            document.querySelectorAll('.theme-btn').forEach(button => {
                button.addEventListener('click', () => applyTheme(button.dataset.theme));
            });

            searchBar.addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    loadArticlesPage({ reset: true }).catch(error => {
                        console.error('Error searching articles:', error);
                    });
                }, 250);
            });

            const preferredTheme = localStorage.getItem('preferredTheme');
            const availableTheme = preferredTheme === 'post-it' ? 'flexoki' : preferredTheme;
            applyTheme(['light', 'flexoki', 'flexoki-dark'].includes(availableTheme) ? availableTheme : 'light');
            initializeFeed();
            setInterval(() => {
                refreshFeeds().catch(() => {});
            }, REFRESH_INTERVAL_MS);
        });
    </script>
</body>

</html>
